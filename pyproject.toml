# Project wide settings including tooling.

# Linting tools

# TODO: fix CodeQL errors and disable temporary named files with NOTEs below

[tool.black]
line-length = 80
exclude = '''
      tests/data/
    | tests/fixture/
'''
# NOTE: the following temporay excludes must be kept in sync between tools
extend-exclude = '''
      bin/checkconf.py
    | bin/createresource.py
    | bin/notifypassword.py
    | sbin/grid_ftps.py
    | sbin/grid_openid.py
    | sbin/grid_sftp.py
    | sbin/grid_webdavs.py
'''

[tool.isort]
profile = "black"
line_length = 80
skip_glob = [".git/*", "tests/data/*", "tests/fixture/*"]
# NOTE: the following temporay excludes must be kept in sync between tools
skip = [
    "bin/checkconf.py",
    "bin/createresource.py",
    "bin/notifypassword.py",
    "sbin/grid_ftps.py",
    "sbin/grid_openid.py",
    "sbin/grid_sftp.py",
    "sbin/grid_webdavs.py"
]

[tool.pylint]
max-line-length = 80
ignore-pattern = '''
      tests/data/
    | tests/fixture/
'''
# NOTE: the following temporay excludes must be kept in sync between tools
ignore-paths = [
    "bin/checkconf.py",
    "bin/createresource.py",
    "bin/notifypassword.py",
    "sbin/grid_ftps.py",
    "sbin/grid_openid.py",
    "sbin/grid_sftp.py",
    "sbin/grid_webdavs.py"
]

[tool.ruff]
line-length = 80
exclude = [".git/", "tests/data/", "tests/fixture/"]
# NOTE: the following temporay excludes must be kept in sync between tools
extend-exclude = [
    "bin/checkconf.py",
    "bin/createresource.py",
    "bin/notifypassword.py",
    "sbin/grid_ftps.py",
    "sbin/grid_openid.py",
    "sbin/grid_sftp.py",
    "sbin/grid_webdavs.py"
]
