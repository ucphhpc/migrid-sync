# Project wide settings including tooling.

# Linting tools

# TODO: fix CodeQL errors and disable temporary named files with NOTEs below

[tool.black]
line-length = 80
exclude = '''
      tests/data/
    | tests/fixture/
'''
# NOTE: the following temporay excludes must be kept in sync between tools
extend-exclude = '''
      bin/checkconf.py
    | bin/createresource.py
    | bin/notifypassword.py
    | sbin/grid_ftps.py
    | sbin/grid_openid.py
    | sbin/grid_sftp.py
    | sbin/grid_webdavs.py
'''

[tool.isort]
profile = "black"
line_length = 80
skip_glob = [".git/*", "tests/data/*", "tests/fixture/*"]
# NOTE: the following temporay excludes must be kept in sync between tools
skip = [
    "bin/checkconf.py",
    "bin/createresource.py",
    "bin/notifypassword.py",
    "sbin/grid_ftps.py",
    "sbin/grid_openid.py",
    "sbin/grid_sftp.py",
    "sbin/grid_webdavs.py"
]

[tool.pylint]
max-line-length = 80
ignore-patterns = '''
      tests/data/
    | tests/fixture/
'''
# NOTE: the following temporay excludes must be kept in sync between tools
ignore-paths = [
    "bin/checkconf.py",
    "bin/createresource.py",
    "bin/notifypassword.py",
    "sbin/grid_ftps.py",
    "sbin/grid_openid.py",
    "sbin/grid_sftp.py",
    "sbin/grid_webdavs.py"
]
# This ensures that pylint does not complain if we dynamically
# adjust the sys.path inside tests to import packages/modules from directories
# such as tests/data.
# Documentation for this can be found at
# https://github.com/databrickslabs/pylint-plugin/blob/b1be1a39703b8d3b693a0afd8a6ee61ff5078cb8/pyproject.toml#L202
[tool.pylint.main]
source-roots = "tests/data"

[tool.ruff]
line-length = 80
exclude = [".git/", "tests/data/", "tests/fixture/"]
# NOTE: the following temporay excludes must be kept in sync between tools
extend-exclude = [
    "bin/checkconf.py",
    "bin/createresource.py",
    "bin/notifypassword.py",
    "sbin/grid_ftps.py",
    "sbin/grid_openid.py",
    "sbin/grid_sftp.py",
    "sbin/grid_webdavs.py"
]
[tool.ruff.lint]
# UP031 = Use format specifiers instead of percent format when interpolating strings
# DTZ006 = datetime.datetime.fromtimestamp()` called without a `tz` argument
ignore = ["UP031", "DTZ006"]
select = ["E713"]

[tool.bandit]
exclude_dirs = [".git/", "tests/data/", "tests/fixture/"]

# Test tools
[tool.pytest.ini_options]
addopts = "-p no:warnings"
